apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: debug-template
  title: Template to debug skeleton templates
  description: Basic template to trigger a github worklfow

spec:
  owner: group:default/engineering
  type: service
  parameters:
    - title: Fill in some steps
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description of the component
        targetPath:
          title: Target Path in repo
          type: string
          description: Name of the directory to create in the repository
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-template
      action: fetch:template
      input:
        url: ../python-app/template
        #templateFileExtension: true
        values:
          app_name: ${{ parameters.rfcNumber }}
          app_env: ${{ parameters.rfcTitle }}
          abstract: ${{ parameters.abstract }}

    - id: read-file
      name: Read File
      action: roadiehq:utils:fs:parse
      input:
        path: ./test.txt

    - id: read-directory
      name: Read Directory
      action: fs:readdir
      input:
        paths: 
          - .

    - id: log-message
      name: Log Message
      action: debug:log
      input:
        message: ${{ steps['read-file'].output.content }}
  
    - id: wait-for-github
      action: debug:wait
      input:
        seconds: 4        

    - id: log-directory-message
      name: Log Directory Message
      action: debug:log
      input:
        message: ${{ steps['read-directory'].output.files | dump(2) }}
        
    - id: publish
      name: Publish
      action: publish:github:pull-request
      input:
        repoUrl: ${{ parameters.repoUrl }}
        title: "Create new project: ${{parameters.name}}"
        branchName: create-${{parameters.name}}
        targetBranchName: main
        description: |
          # New project: ${{parameters.name}}

          ${{ parameters.description if parameters.description }}
        targetPath: ${{ parameters.targetPath if parameters.targetPath else parameters.name }}
  output:
    links:
      - url: ${{steps.publish.output.remoteUrl}}
        title: "Go to PR"