apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: debug-template
  title: Template to debug skeleton templates
  description: Basic template to trigger a github worklfow

spec:
  owner: group:default/engineering
  type: service
  parameters:
    - title: Fill in some steps
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:field: EntityNamePicker
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Description of the component
        targetPath:
          title: Target Path in repo
          type: string
          description: Name of the directory to create in the repository
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
            requestUserCredentials:
              secretsKey: GITHUB_TOKEN          
              additionalScopes:
                github:
                  - repo
                  - workflow

  steps:
    - id: fetch-template
      action: fetch:template
      input:
        url: ../python-app/template
        #templateFileExtension: true
        values:
          app_name: ${{ parameters.rfcNumber }}
          app_env: ${{ parameters.rfcTitle }}
          abstract: ${{ parameters.abstract }}
          
    - id: debug List workspace
      name: List workspace
      action: debug:log
      listWorkspace: true
      
    - id: read-file
      name: Read File
      action: roadiehq:utils:fs:parse
      input:
        path: ./test.txt

    - id: read-directory
      name: Read Directory
      action: fs:readdir
      input:
        paths: 
          - .

    - id: log-message
      name: Log Message
      action: debug:log
      input:
        message: ${{ steps['read-file'].output.content }}
  
    - id: wait-for-github
      action: debug:wait
      input:
        seconds: 4        

    # - id: log-directory-message
      # name: Log Directory Message
      # action: debug:log
      # input:
        # message: ${{ steps['read-directory'].output.files | dump(2) }}
        
    - id: log-directory-message
      name: Log Directory Message
      action: debug:log
      input:
        message: ${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}
        
    - id: check_repo_exists
      name: Check if repository already exists
      action: http:backstage:request
      input:
        method: GET
        path: /proxy/github/api/repos/${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }}
        headers:
          Accept: application/vnd.github.v3+json
          
    - id: log-repo-message
      name: Repo Message
      action: debug:log
      input:
        message: |                
          Status Code: ${{ steps['check_repo_exists'].output.code | dump(2) }}
          Body: ${{ steps['check_repo_exists'].output.body | dump(2) }} 
          Headers: ${{ steps['check_repo_exists'].output.headers | dump(2)}}
                    
    - id: fail_if_exists
      name: Fail if repo already exists
      action: debug:log
      if: ${{ steps['check_repo_exists'].output.code === 200 }}
      input:
        message: Repository ${{ (parameters.repoUrl | parseRepoUrl).owner }}/${{ (parameters.repoUrl | parseRepoUrl).repo }} already exists!
        
